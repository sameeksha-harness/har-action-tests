name: Test setup-harness-cli

on:
  push:
    branches: [main]

jobs:
  upload-generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Harness CLI
        uses: sameeksha-harness/setup-harness-cli@v1
        with:
          api-url: https://prod1.harness.io
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - name: Upload generic artifact
        run: |
          hc artifact push generic generictest test-artifact.txt \
            --name test-artifact \
            --version 1.0.1

  upload-rpm:
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: dnf install -y --allowerasing rpm-build which curl

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
          cp rpm/test-package.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/test-package.spec
          cp ~/rpmbuild/RPMS/noarch/test-package-1.0.0-1.noarch.rpm /tmp/test-package.rpm

      - name: Setup Harness CLI
        uses: sameeksha-harness/setup-harness-cli@v1
        with:
          api-url: https://prod1.harness.io
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - name: Upload RPM
        run: hc artifact push rpm rpmtest /tmp/test-package.rpm

  upload-python:
    runs-on: ubuntu-latest
    steps:
      - name: Build Python wheel
        run: |
          mkdir -p /tmp/mypkg /tmp/dist
          cat > /tmp/mypkg/setup.py << 'EOF'
          from setuptools import setup
          setup(name='test-package', version='1.0.0')
          EOF
          pip wheel /tmp/mypkg -w /tmp/dist/
          echo "WHEEL_PATH=$(ls /tmp/dist/*.whl)" >> $GITHUB_ENV

      - name: Setup Harness CLI
        uses: sameeksha-harness/setup-harness-cli@v1
        with:
          api-url: https://prod1.harness.io
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - name: Upload Python package
        run: hc artifact push python pythontest ${{ env.WHEEL_PATH }}

  upload-multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create generic artifact
        run: |
          echo "build output" > build.txt
          tar -czf build.tar.gz build.txt

      - name: Create Python wheel
        run: |
          mkdir -p /tmp/pypkg dist
          printf '[metadata]\nname=my_pkg\nversion=1.0.0\n' > /tmp/pypkg/setup.cfg
          printf 'from setuptools import setup\nsetup()\n' > /tmp/pypkg/setup.py
          pip wheel /tmp/pypkg -w dist

      - name: Create npm tarball
        run: |
          mkdir -p /tmp/npmpkg
          printf '{"name":"my-pkg","version":"1.0.0"}\n' > /tmp/npmpkg/package.json
          cd /tmp/npmpkg && npm pack --pack-destination $GITHUB_WORKSPACE

      - uses: sameeksha-harness/setup-harness-cli@v1
        with:
          api-url: https://app.harness.io
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - run: hc artifact push generic generictest build.tar.gz --name my-app --version 1.0.0

      - run: hc artifact push python pythontest dist/my_pkg-1.0.0-py3-none-any.whl

      - run: hc artifact push npm npmtest my-pkg-1.0.0.tgz

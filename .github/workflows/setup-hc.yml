name: Test setup-harness-cli

on:
  push:
    branches: [main]

env:
  HARNESS_ORG_ID: default
  HARNESS_PROJECT_ID: donotdelete-sameeksha

jobs:
  upload-generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Harness CLI
        uses: sameeksha-harness/setup-harness-cli@AH-6229
        with:
          api-url: ${{ secrets.HARNESS_URL }}
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}
          cli-version: v3.12.0   # optional; omit for latest

      - name: Show version
        run: harness version

      - name: Upload generic artifact
        run: |
          harness push artifact:generic generictest/test-artifact test-artifact.txt \
            --version 4.0.1

  upload-rpm:
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: dnf install -y --allowerasing rpm-build tar curl

      - name: Build RPM
        run: |
          mkdir -p ~/rpmbuild/{SPECS,BUILD,BUILDROOT,RPMS,SRPMS}
          cp rpm/test-package.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/test-package.spec
          cp ~/rpmbuild/RPMS/noarch/test-package-1.0.0-1.noarch.rpm /tmp/test-package.rpm

      - name: Setup Harness CLI
        uses: sameeksha-harness/setup-harness-cli@AH-6229
        with:
          api-url: ${{ secrets.HARNESS_URL }}
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - name: Upload RPM
        run: harness push artifact:rpm rpmtest /tmp/test-package.rpm

  upload-python:
    runs-on: ubuntu-latest
    steps:
      - name: Build Python wheel
        run: |
          mkdir -p /tmp/mypkg /tmp/dist
          cat > /tmp/mypkg/setup.py << 'EOF'
          from setuptools import setup
          setup(name='test-package', version='1.0.0')
          EOF
          pip wheel /tmp/mypkg -w /tmp/dist/
          echo "WHEEL_PATH=$(ls /tmp/dist/*.whl)" >> $GITHUB_ENV

      - name: Setup Harness CLI
        uses: sameeksha-harness/setup-harness-cli@AH-6229
        with:
          api-url: ${{ secrets.HARNESS_URL }}
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - name: Upload Python package
        run: harness push artifact:python pythontest ${{ env.WHEEL_PATH }}

  upload-multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create generic artifact
        run: |
          echo "build output" > build.txt
          tar -czf build.tar.gz build.txt

      - name: Create Python wheel
        run: |
          mkdir -p /tmp/pypkg dist
          printf '[metadata]\nname=my_pkg\nversion=1.0.0\n' > /tmp/pypkg/setup.cfg
          printf 'from setuptools import setup\nsetup()\n' > /tmp/pypkg/setup.py
          pip wheel /tmp/pypkg -w dist

      - uses: sameeksha-harness/setup-harness-cli@AH-6229
        with:
          api-url: ${{ secrets.HARNESS_URL }}
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}

      - run: harness push artifact:generic generictest/my-app build.tar.gz --version 4.0.0

      - run: harness push artifact:python pythontest dist/my_pkg-1.0.0-py3-none-any.whl

  upload-cross-os:
    strategy:
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: sameeksha-harness/setup-harness-cli@AH-6229
        with:
          api-url: ${{ secrets.HARNESS_URL }}
          account: ${{ secrets.HARNESS_ACCOUNT_ID }}
          token: ${{ secrets.HARNESS_PAT_TOKEN }}
      - run: harness push artifact:generic generictest/test-artifact-${{ matrix.os }} test-artifact.txt --version 4.0.1
        shell: bash
